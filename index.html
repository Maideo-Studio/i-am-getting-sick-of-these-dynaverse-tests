<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Three.js Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2595f3; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(255,255,255,0.8); padding: 15px; border-radius: 8px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="setup">
            <h3>Multiplayer Lobby</h3>
            <button onclick="engine.hostGame()">Host Game</button>
            <hr>
            <input type="text" id="joinId" placeholder="Paste ID here">
            <button onclick="engine.joinGame()">Join Game</button>
        </div>
        <div id="status" class="hidden">
            <p>Your ID: <b id="myId">...</b></p>
            <p id="peerStatus">Waiting for players...</p>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        class MultiplayerEngine {
            constructor() {
                this.keys = {};
                this.speed = 0.1;
                this.rotationSpeed = 0.05;
                this.cameraAngle = 0;
                this.cameraDistance = 8;
                this.cameraHeight = 4;
                this.isJumping = false;
                this.velocity_y = 0;
                this.gravity = -0.05;
                this.jumpStrength = 0.8;

                // Multiplayer State
                this.peer = null;
                this.connections = [];
                this.remotePlayers = {}; // Stores meshes of other players

                this.initScene();
                this.initCamera();
                this.initRenderer();
                this.initLights();
                this.initObjects();
                this.initControls();
                this.addResizeListener();
                this.animate();
            }

            // --- MULTIPLAYER LOGIC ---

            initPeer(id = null) {
                this.peer = id ? new Peer() : new Peer();
                
                this.peer.on('open', (myId) => {
                    document.getElementById('myId').innerText = myId;
                    document.getElementById('setup').classList.add('hidden');
                    document.getElementById('status').classList.remove('hidden');
                });

                this.peer.on('connection', (conn) => {
                    this.setupConnection(conn);
                });
            }

            hostGame() {
                this.initPeer();
            }

            joinGame() {
                const targetId = document.getElementById('joinId').value;
                this.initPeer();
                const conn = this.peer.connect(targetId);
                this.setupConnection(conn);
            }

            setupConnection(conn) {
                conn.on('open', () => {
                    this.connections.push(conn);
                    document.getElementById('peerStatus').innerText = "Connected!";
                    // Send initial "hello"
                    conn.send({ type: 'init' });
                });

                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        this.updateRemotePlayer(conn.peer, data);
                    }
                });

                conn.on('close', () => {
                    if (this.remotePlayers[conn.peer]) {
                        this.scene.remove(this.remotePlayers[conn.peer]);
                        delete this.remotePlayers[conn.peer];
                    }
                });
            }

            broadcastMove() {
                const data = {
                    type: 'move',
                    pos: this.player.position,
                    rot: this.player.rotation.y
                };
                this.connections.forEach(conn => conn.send(data));
            }

            updateRemotePlayer(id, data) {
                if (!this.remotePlayers[id]) {
                    // Create a new mesh for the remote player if they don't exist
                    const remoteGroup = this.createPlayerMesh(0x33ff33); // Green color for others
                    this.remotePlayers[id] = remoteGroup;
                    this.scene.add(remoteGroup);
                }
                const p = this.remotePlayers[id];
                p.position.copy(data.pos);
                p.rotation.y = data.rot;
            }

            // --- ENGINE & VISUALS ---

            initScene() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x2595f3);
            }

            initCamera() {
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            }

            initRenderer() {
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(this.renderer.domElement);
            }

            initLights() {
                this.scene.add(new THREE.AmbientLight(0xffffff, 1.5));
                const sun = new THREE.DirectionalLight(0xffffff, 2);
                sun.position.set(5, 10, 5);
                this.scene.add(sun);
            }

            createPlayerMesh(bodyColor = 0x990099) {
                const group = new THREE.Group();
                const geometry = new THREE.BoxGeometry();
                const loader = new THREE.TextureLoader();

                // Head
                const faceTex = loader.load("https://raw.githubusercontent.com/Maideo-Studio/Dynaverse-faces/main/76baf281-4d65-4780-bbec-a7f7b27c9ae7.png");
                const headMats = Array(6).fill(new THREE.MeshStandardMaterial({ color: 0xd524b0 }));
                headMats[4] = new THREE.MeshStandardMaterial({ map: faceTex, color: 0xfc55cc });
                const head = new THREE.Mesh(geometry, headMats);
                head.scale.set(1.5, 1, 1);
                group.add(head);

                // Body
                const body = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: bodyColor }));
                body.position.set(0, -0.8, 0);
                body.scale.set(0.6, 0.6, 0.5);
                group.add(body);

                // Limbs
                const limbMat = new THREE.MeshStandardMaterial({ color: 0xd524b0 });
                const offsets = [[-0.41, -0.8], [0.41, -0.8], [-0.2, -1.3], [0.2, -1.3]];
                offsets.forEach(off => {
                    const limb = new THREE.Mesh(geometry, limbMat);
                    limb.position.set(off[0], off[1], 0);
                    limb.scale.set(0.2, 0.6, 0.3);
                    group.add(limb);
                });

                return group;
            }

            initObjects() {
                // Ground
                const loader = new THREE.TextureLoader();
                const groundTex = loader.load("https://raw.githubusercontent.com/Maideo-Studio/Dynaverse-faces/main/roblox-stud%20(1).png");
                groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
                groundTex.repeat.set(100, 100);
                groundTex.magFilter = THREE.NearestFilter;
                
                const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ map: groundTex }));
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -1.1;
                this.scene.add(ground);

                // Local Player
                this.player = this.createPlayerMesh();
                this.player.position.y = 0.5;
                this.scene.add(this.player);
            }

            initControls() {
                window.addEventListener("keydown", (e) => this.keys[e.key.toLowerCase()] = true);
                window.addEventListener("keyup", (e) => this.keys[e.key.toLowerCase()] = false);
            }

            updateMovement() {
                const forward = new THREE.Vector3();
                this.camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();
                const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                
                let moved = false;
                const oldPos = this.player.position.clone();

                if (this.keys["w"]) { this.player.position.add(forward.clone().multiplyScalar(this.speed)); moved = true; }
                if (this.keys["s"]) { this.player.position.add(forward.clone().multiplyScalar(-this.speed)); moved = true; }
                if (this.keys["a"]) { this.player.position.add(right.clone().multiplyScalar(-this.speed)); moved = true; }
                if (this.keys["d"]) { this.player.position.add(right.clone().multiplyScalar(this.speed)); moved = true; }

                if (this.keys[" "] && !this.isJumping) {
                    this.velocity_y = this.jumpStrength;
                    this.isJumping = true;
                }

                if (this.isJumping || this.player.position.y > 0.5) {
                    this.player.position.y += this.velocity_y;
                    this.velocity_y += this.gravity;
                    moved = true;
                }

                if (this.player.position.y < 0.5) {
                    this.player.position.y = 0.5;
                    this.isJumping = false;
                    this.velocity_y = 0;
                }

                if (moved) {
                    const dir = new THREE.Vector3().subVectors(this.player.position, oldPos);
                    if (dir.x !== 0 || dir.z !== 0) {
                        this.player.lookAt(this.player.position.clone().add(dir));
                    }
                    // Sync with others
                    if (this.connections.length > 0) this.broadcastMove();
                }

                if (this.keys["e"]) this.cameraAngle -= this.rotationSpeed;
                if (this.keys["q"]) this.cameraAngle += this.rotationSpeed;

                this.camera.position.set(
                    this.player.position.x + Math.sin(this.cameraAngle) * this.cameraDistance,
                    this.player.position.y + this.cameraHeight,
                    this.player.position.z + Math.cos(this.cameraAngle) * this.cameraDistance
                );
                this.camera.lookAt(this.player.position);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.updateMovement();
                this.renderer.render(this.scene, this.camera);
            }

            addResizeListener() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
        }

        const engine = new MultiplayerEngine();
    </script>
</body>
</html>
