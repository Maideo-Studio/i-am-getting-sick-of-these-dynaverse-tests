<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js + Peer.js Multiplayer</title>
<style>
  body { margin: 0; overflow: hidden; background: #2595f3; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script> <!-- Peer.js CDN -->

<script>
class SimpleEngine {
    constructor() {
        this.keys = {};
        this.speed = 0.1;
        this.rotationSpeed = 0.05;
        this.cameraAngle = 0;
        this.cameraDistance = 8;
        this.cameraHeight = 4;
        this.isJumping = false;
        this.velocity_y = 0;
        this.gravity = -0.05;
        this.jumpStrength = 0.8;

        this.players = {}; // Stores all players (self + peers)
        this.myId = null;

        this.initScene();
        this.initCamera();
        this.initRenderer();
        this.initLights();
        this.initObjects();
        this.initControls();
        this.initPeer(); // <-- initialize Peer.js
        this.addResizeListener();
        this.animate();
    }

    initScene() { this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x2595f3); }
    initCamera() { this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); }
    initRenderer() { this.renderer = new THREE.WebGLRenderer({ antialias: true }); this.renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(this.renderer.domElement); }
    initLights() { const ambient = new THREE.AmbientLight(0xffffff, 1.5); this.scene.add(ambient); const directional = new THREE.DirectionalLight(0xffffff, 2); directional.position.set(5,10,5); this.scene.add(directional); }

    initObjects() {
        const loader = new THREE.TextureLoader();
        const groundTexture = loader.load("https://raw.githubusercontent.com/Maideo-Studio/Dynaverse-faces/main/roblox-stud%20(1).png");
        groundTexture.wrapS = groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(100, 100);
        groundTexture.magFilter = THREE.NearestFilter;
        const groundMat = new THREE.MeshStandardMaterial({ map: groundTexture });
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        this.ground = new THREE.Mesh(groundGeo, groundMat);
        this.ground.rotation.x = -Math.PI/2;
        this.ground.position.y = -1.1;
        this.scene.add(this.ground);

        // Add **my player**
        this.createPlayer("me", 0, 0, 0);
    }

    createPlayer(id, x, y, z) {
        const loader = new THREE.TextureLoader();
        const player = new THREE.Group();
        player.position.set(x,y,z);

        const geometry = new THREE.BoxGeometry();
        const faceTexture = loader.load("https://raw.githubusercontent.com/Maideo-Studio/Dynaverse-faces/main/76baf281-4d65-4780-bbec-a7f7b27c9ae7.png");
        faceTexture.magFilter = THREE.NearestFilter;

        const headMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xd524b0 }),
            new THREE.MeshStandardMaterial({ color: 0xd524b0 }),
            new THREE.MeshStandardMaterial({ color: 0xd524b0 }),
            new THREE.MeshStandardMaterial({ color: 0xd524b0 }),
            new THREE.MeshStandardMaterial({ map: faceTexture, color: 0xfc55cc }),
            new THREE.MeshStandardMaterial({ color: 0xd524b0 })
        ];
        const head = new THREE.Mesh(geometry, headMaterials);
        head.scale.set(1.5,1,1);
        player.add(head);

        const bodyMat = new THREE.MeshStandardMaterial({ color:0x990099 });
        const body = new THREE.Mesh(geometry, bodyMat);
        body.position.set(0,-0.8,0);
        body.scale.set(0.6,0.6,0.5);
        player.add(body);

        this.scene.add(player);
        this.players[id] = { group: player, velocity_y:0, isJumping:false };
        return player;
    }

    initControls() {
        window.addEventListener("keydown", e => this.keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => this.keys[e.key.toLowerCase()] = false);
    }

    updateMovement() {
        const me = this.players["me"];
        const forward = new THREE.Vector3();
        this.camera.getWorldDirection(forward);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3();
        right.crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

        let moved = false;
        if(this.keys["w"]){ me.group.position.add(forward.clone().multiplyScalar(this.speed)); moved=true; }
        if(this.keys["s"]){ me.group.position.add(forward.clone().multiplyScalar(-this.speed)); moved=true; }
        if(this.keys["a"]){ me.group.position.add(right.clone().multiplyScalar(-this.speed)); moved=true; }
        if(this.keys["d"]){ me.group.position.add(right.clone().multiplyScalar(this.speed)); moved=true; }

        if(this.keys[" "] && !me.isJumping){ me.velocity_y=this.jumpStrength; me.isJumping=true; }
        if(me.isJumping || me.group.position.y>0.5){ me.group.position.y += me.velocity_y; me.velocity_y += this.gravity; }
        if(me.group.position.y<0.5){ me.group.position.y=0.5; me.isJumping=false; me.velocity_y=0; }

        if(moved){
            const vel = new THREE.Vector3(0,0,0);
            if(this.keys["w"]) vel.add(forward);
            if(this.keys["s"]) vel.add(forward.clone().negate());
            if(this.keys["a"]) vel.add(right.clone().negate());
            if(this.keys["d"]) vel.add(right);
            if(vel.lengthSq()>0) me.group.lookAt(me.group.position.clone().add(vel.normalize()));
        }

        if(this.keys["e"]) this.cameraAngle -= this.rotationSpeed;
        if(this.keys["q"]) this.cameraAngle += this.rotationSpeed;
        const camX = me.group.position.x + Math.sin(this.cameraAngle)*this.cameraDistance;
        const camZ = me.group.position.z + Math.cos(this.cameraAngle)*this.cameraDistance;
        this.camera.position.set(camX, me.group.position.y + this.cameraHeight, camZ);
        this.camera.lookAt(me.group.position);

        // SEND POSITION TO PEERS
        if(this.peer && this.connections){
            const pos = { x: me.group.position.x, y: me.group.position.y, z: me.group.position.z };
            this.connections.forEach(conn => conn.send({ type:"pos", id:this.myId, pos }));
        }
    }

    initPeer() {
        this.peer = new Peer(); // Random ID assigned
        this.connections = [];
        this.peer.on('open', id => {
            this.myId = id;
            console.log("My peer ID:", id);
            // For testing, prompt to connect to another peer
            const other = prompt("Enter peer ID to connect (leave blank if none):");
            if(other) this.connectToPeer(other);
        });

        this.peer.on('connection', conn => {
            this.connections.push(conn);
            conn.on('data', data => this.handlePeerData(data));
        });
    }

    connectToPeer(otherId){
        const conn = this.peer.connect(otherId);
        this.connections.push(conn);
        conn.on('data', data => this.handlePeerData(data));
    }

    handlePeerData(data){
        if(data.type==="pos"){
            if(!this.players[data.id]) this.createPlayer(data.id, data.pos.x, data.pos.y, data.pos.z);
            else this.players[data.id].group.position.set(data.pos.x,data.pos.y,data.pos.z);
        }
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        this.updateMovement();
        this.renderer.render(this.scene, this.camera);
    }

    addResizeListener() {
        window.addEventListener('resize', ()=>{
            this.camera.aspect = window.innerWidth/window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
}

new SimpleEngine();
</script>
</body>
</html>
